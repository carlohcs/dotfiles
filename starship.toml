# ~/.config/starship.toml

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

format = """
[┌──](bold purple) $directory$git_branch$git_status [::](bold purple) $time
[└](bold purple)$cmd_duration[─❯ ](bold purple)"""
right_format = """(green)($python) (green)(${nodejs}) $battery"""


[python]
format = '[\[$symbol$version\][(\[$virtualenv\])](dimmed red)]($style)'
symbol = '👾 '
version_format = 'v${raw}'
pyenv_version_name = false

[git_branch]
format = ' [:: ](bold purple)[$symbol$branch]($style)'
style = "purple bold"

[git_commit]
format = '[\[commit hash:$hash$tag\]]($style)'
commit_hash_length = 8
only_detached = false
tag_disabled = false
style = "dimmed yellow"

[git_state]
format = '[$state( $progress_current of $progress_total)]($style)'
style = "dimmed yellow"

[git_status]
format = ' [-](dimmed white)([$all_status$ahead_behind]($style))'
style = "red bold"
conflicted = "⚡"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = " ?${count}"
stashed = " 📦${count}"
modified = " !${count}"
staged = " +${count}"
renamed = " »${count}"
deleted = " ✘${count}"


[hostname]
ssh_only = false
format = "[$hostname]($style)"
trim_at = "-"
style = "bold dimmed blue"
disabled = false

[username]
show_always = true
style_root = "bg:#9A348E"
format = '[$user]($style)'
disabled = false
style_user = "bold dimmed blue"


[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
utc_time_offset = "local"
# style = "italic dimmed white"
style = "dimmed white"



[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 100
style = "bold red"

[character]
error_symbol = "[✖](bold red) "

[cmd_duration]
min_time = 10_000 # Show command duration over 10,000 milliseconds (=10 sec)
style = "dimmed red"
format = '[\(took $duration\)]($style)'

[directory]
truncation_length = 5
format = "[$path]($style)[$lock_symbol]($lock_style)"



