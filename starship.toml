[julia]
format = "[$symbol$version]($style) "
symbol = "ஃ "
style = "bold green"

[memory_usage]
format = "$symbol[${ram}( | ${swap})]($style) "
threshold = 70
style = "bold dimmed white"
disabled = false

[package]
disabled = true



[rust]
format = "[$symbol$version]($style) "
style = "bold green"



[typst]
format = "[$symbol($version)]($style)"
style = "bold #239dae"

[sudo]
format = "[$symbol]($style)"
style = "bold italic bright-purple"
symbol = "⋈┈"
disabled = false



[nodejs]
format = "[⬢ $version](bold green)"
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]
detect_files = ["package.json", ".nvmrc", ".tool-versions"]
detect_folders = ["node_modules"]